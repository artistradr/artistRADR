<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── Favicon ── -->
    <link rel="icon" type="image/png" href="/radr-logo.png" />
    <link rel="apple-touch-icon" href="/radr-logo.png" />

    <!-- ── Primary SEO ── -->
    <title>Artist RADR — Discover Emerging Music Artists & Sounds</title>
    <meta name="description" content="Artist RADR spotlights emerging music artists, curated playlists, and fresh sounds from around the world. Discover new talent, submit your track, and stay ahead of the curve." />
    <meta name="keywords" content="emerging artists, music discovery, new music, curated playlists, artist spotlight, independent music, submit track, music blog, underground music, Artist RADR" />
    <meta name="author" content="Artist RADR" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://artistradr.com" />

    <!-- ── Open Graph (Facebook, WhatsApp, LinkedIn) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Artist RADR" />
    <meta property="og:title" content="Artist RADR — Discover Emerging Music Artists & Sounds" />
    <meta property="og:description" content="Spotlighting emerging talent. Discover new artists, curated playlists, and stories from the underground — all in one place." />
    <meta property="og:url" content="https://artistradr.com" />
    <meta property="og:image" content="https://artistradr.com/radr-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- ── Twitter / X Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@artistradr" />
    <meta name="twitter:creator" content="@artistradr" />
    <meta name="twitter:title" content="Artist RADR — Discover Emerging Music Artists & Sounds" />
    <meta name="twitter:description" content="Spotlighting emerging talent. Discover new artists, curated playlists, and stories from the underground — all in one place." />
    <meta name="twitter:image" content="https://artistradr.com/radr-logo.png" />

    <!-- ── Theme colour (browser chrome on mobile) ── -->
    <meta name="theme-color" content="#D94F2B" />
    <meta name="msapplication-TileColor" content="#0E0E0E" />

    <!-- ── Structured Data (Google rich results) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Artist RADR",
      "url": "https://artistradr.com",
      "logo": "https://artistradr.com/radr-logo.png",
      "description": "Artist RADR is a music discovery platform spotlighting emerging artists, curated playlists, and fresh sounds from around the world.",
      "sameAs": [
        "https://instagram.com/artistradr",
        "https://twitter.com/artistradr",
        "https://youtube.com/@artistradr"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@artistradr.com",
        "contactType": "Customer Support"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Artist RADR",
      "url": "https://artistradr.com",
      "description": "Discover emerging music artists, curated playlists, and fresh sounds. Submit your track and get on the RADR.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://artistradr.com/blog?s={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root">
      <!--
        Fallback content for crawlers/verifiers that don't execute JavaScript
        (e.g. Google's OAuth consent-screen branding verifier). This is
        replaced by the real React app once main.jsx hydrates the #root div —
        it's not shown to normal users with JS enabled, only ever to a
        no-JS crawl or a browser with JS disabled.
      -->
      <noscript>
        <div style="font-family: sans-serif; max-width: 640px; margin: 60px auto; padding: 0 20px; color: #111;">
          <h1>Artist RADR</h1>
          <p>
            Artist RADR is a music discovery platform spotlighting emerging artists, curated
            playlists, and fresh sounds from around the world. Discover new talent, submit
            your track for playlist consideration, and stay ahead of the curve.
          </p>
          <p>
            Enable JavaScript to use the full Artist RADR experience at
            <a href="https://artistradr.com">artistradr.com</a>.
          </p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
